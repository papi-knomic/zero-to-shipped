<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lapse reads the dates on your licences, contracts, insurance policies and permits, then emails reminders 60, 30 and 7 days before anything expires." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M16 8.5a7.5 7.5 0 1 0 7.5 7.5' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/><path d='M16 12.2v4l2.6 1.7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Lapse — never miss a renewal</title>
  </head>
  <body>
    <!--
      Static markup mirrors App.tsx so crawlers and no-JS visitors see real content.
      React replaces it on mount. Keep the headline and description in sync with App.tsx.
    -->
    <div id="root">
      <div class="shell">
        <header class="nav">
          <span class="brand"><span class="wordmark">Lapse</span></span>
        </header>
        <main class="content">
          <section class="hero">
            <div class="hero-copy">
              <h1>Never miss a <span class="accent">renewal.</span></h1>
              <p class="lede">
                Upload a licence, contract, insurance policy, permit or certification. Lapse reads the
                dates for you, you confirm them, and it emails reminders 60, 30 and 7 days before
                anything expires.
              </p>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lapse reads the dates on your licences, contracts, insurance policies and permits, then emails reminders 60, 30 and 7 days before anything expires." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23d9480f' stroke-width='4'/><path d='M16 9v7l5 3' stroke='%23d9480f' stroke-width='3' fill='none' stroke-linecap='round'/></svg>" />
    <title>Lapse — never miss a renewal</title>
  </head>
  <body>
    <!--
      Static markup mirrors App.tsx so crawlers and no-JS visitors see real content.
      React replaces it on mount. Keep the headline and description in sync with App.tsx.
    -->
    <div id="root">
      <div class="shell">
        <header class="topbar">
          <div class="brand"><span class="logo" aria-hidden="true"></span><span>Lapse</span></div>
        </header>
        <main class="content">
          <h1>Never miss a renewal.</h1>
          <p class="lede">
            Upload a licence, contract, insurance policy, permit or certification. Lapse reads the
            dates for you, you confirm them, and it emails reminders 60, 30 and 7 days before
            anything expires.
          </p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
